<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptNest</title><link rel="stylesheet" href="popup.css"></head><body><main class="shell">
<header><div class="brand"><span>P</span><div><strong>PromptNest</strong><small>Capture rapide</small></div></div><button id="openApp" class="icon-button" title="Ouvrir l’application" aria-label="Ouvrir l’application">↗</button></header>
<section id="loading" class="state"><span class="spinner"></span><p>Connexion à votre espace…</p></section>
<section id="signedOut" class="state hidden"><div class="hero-mark">P</div><h1>Vos meilleures idées,<br>toujours à portée.</h1><p>Connectez-vous avec le même compte Google que sur PromptNest.</p><button id="signIn" class="primary google"><b>G</b> Continuer avec Google</button><p class="privacy">Connexion sécurisée par Google et Supabase.</p></section>
<section id="capture" class="hidden"><div class="account"><span id="avatar">P</span><div><strong id="accountName">Compte connecté</strong><small id="accountEmail"></small></div><button id="signOut" class="link">Déconnexion</button></div><div class="page-card"><span>◫</span><div><strong id="pageTitle">Page active</strong><small id="pageUrl"></small></div></div>
<form id="captureForm"><label>TITRE<input id="title" maxlength="160" required placeholder="Nom de ce prompt"></label><label>PROMPT OU IDÉE<textarea id="content" maxlength="50000" required rows="6" placeholder="Écrivez ou collez votre prompt…"></textarea></label><div id="selectionWrap" class="selection hidden"><span>SÉLECTION CAPTURÉE</span><p id="selection"></p></div><label>NOTE PERSONNELLE<textarea id="note" rows="2" placeholder="Pourquoi le conserver ? (facultatif)"></textarea></label><label>CATÉGORIE<select id="category"><option>Développement</option><option>Produit</option><option>Marketing</option><option>Rédaction</option><option>Recherche</option><option selected>Général</option></select></label><button id="save" class="primary" type="submit">Enregistrer dans PromptNest</button></form>
<div id="message" class="message hidden" role="status"></div><footer><span>Ctrl + Maj + P</span><button id="viewPrompts" class="link">Voir tous mes prompts →</button></footer></section>
</main><script src="popup.js"></script></body></html>
